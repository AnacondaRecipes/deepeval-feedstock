{% set name = "deepeval" %}
{% set version = "4.1.0" %}
{% set deselect_tests = " --deselect=gh_src/tests/test_core/test_tracing/test_integration" %}
{% set deselect_tests = 'deselect_tests + " --deselect=gh_src/tests/test_core/test_datasets/test_dataset.py::TestSaveAndLoad"' %}
{% set deselect_tests = 'deselect_tests + " --deselect=gh_src/tests/test_core/test_evaluation/test_end_to_end/test_configs.py::TestEvalsIterator"' %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/test_core/test_evaluation/test_end_to_end/test_skip_reset.py" %}
{% set deselect_tests = 'deselect_tests + " --deselect=gh_src/tests/test_core/test_models/test_embedding_models/test_ollama_embedding_model.py::test_ollama_embedding_model_accepts_legacy_host_keyword_and_maps_to_base_url"' %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/test_core/test_simulator/test_conversation_simulator.py" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/test_core/test_synthesizer/test_context_generator.py" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/test_core/test_synthesizer/test_doc_chunker.py" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/test_core/test_synthesizer/test_generate_from_goldens.py" %}
{% set deselect_tests = deselect_tests + " --deselect=gh_src/tests/test_core/test_synthesizer/test_synthesizer.py" %}
{% set deselect_tests = 'deselect_tests + " --deselect=gh_src/tests/test_core/test_evaluation/test_local_store.py::TestForLoopFlow::test_chronological_sort_matches_write_order"' %}
{% set deselect_tests = 'deselect_tests + " --deselect=gh_src/tests/test_core/test_config/test_settings.py::test_env_dir_path_expanduser"' %}

# >   raise self._make_status_error_from_response(err.response) from None
# E   openai.AuthenticationError: Error code: 401 - {'error': {'message': 'Incorrect API key provided: test-ope***-key. You can find your API key at https://platform.openai.com/account/api-keys.', 'type': 'invalid_request_error', 'param': None, 'code': 'invalid_api_key'}}
package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 03c5206a4258c6831affdb92aee1a4b131d37daf92df8af122c745f482d85268
    patches:
      - patches/0001-Remove-pytest-repeat-from-the-deps-to-aboid-pip-chec.patch
      - url: https://github.com/confident-ai/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: ad2b16b74b212ae14dc7fdf9cdce2ffb8802d61a8f5104c1ba0b45c3cae48b37
    folder: gh_src

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - poetry-core
  run:
    - python
    - requests >=2.31.0,<3.0.0
    - tqdm >=4.66.1,<5.0.0
    - pytest
    - pytest-xdist
    - pytest-rerunfailures
    - pytest-asyncio
    - tabulate >=0.9.0,<0.10.0
    - sentry-sdk
    - rich >=13.6.0,<15.0.0
    - portalocker
    - openai
    - aiohttp
    - typer >=0.9,<1.0.0
    - click >=8.0.0,<8.4.0
    - nest-asyncio
    - tenacity >=8.0.0,<=10.0.0
    - opentelemetry-api >=1.24.0,<2.0.0
    - opentelemetry-sdk >=1.24.0,<2.0.0
    - grpcio >=1.67.1,<2.0.0
    - posthog >=5.4.0,<7.0.0  # [py<310]
    - posthog >=7.0.0,<8.0.0  # [py>=310]
    - pyfiglet
    - python-dotenv >=1.1.1,<2.0.0
    - pydantic >=2.11.7,<3.0.0
    - pydantic-settings >=2.10.1,<3.0.0
    - jinja2
    # Need to fix pip check
    - setuptools
    - wheel
    - pytest-repeat
    - questionary >=2.0.0,<3.0.0
  run_constrained:
    # integrations
    - crewai  # [py>=310 and py<314]
    - pydantic-ai  # [py>=310 and py<314]
    - llama-index >=0.14.4,<0.15.0
    - openai-agents >=0.3.3,<0.4.0
    # langchain
    # Added upper-bound to save compatibility with other pkgs in the dependency tree
    - langchain >=1.2.4,<2  # [py>=310]
    - langchain-openai >=1.1.7,<2  # [py>=310]
    - langgraph >=1.0.7,<2
    - textual >=0.80,<2.0
    - pyperclip >=1.8.0,<2.0.0

test:
  source_files:
    - gh_src/tests
  imports:
    - deepeval
  commands:
    - pip check
    - pytest -v --asyncio-mode=auto gh_src/tests/test_core {{ deselect_tests }}
  requires:
    - pip
    - transformers

about:
  home: https://github.com/confident-ai/deepeval
  summary: The LLM Evaluation Framework
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.md
  description: |
    DeepEval is a simple-to-use, open-source LLM evaluation framework,
    for evaluating large-language model systems. It is similar to Pytest
    but specialized for unit testing LLM apps. DeepEval incorporates the
    latest research to run evals via metrics such as G-Eval, task completion,
    answer relevancy, hallucination, etc., which uses LLM-as-a-judge and other
    NLP models that run locally on your machine.
  dev_url: https://github.com/confident-ai/deepeval
  doc_url: https://deepeval.com

extra:
  skip-lints:
    - python_build_tool_in_run
